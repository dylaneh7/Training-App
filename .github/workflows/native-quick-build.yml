name: Fast Health Coach Native Build
on:
  push:
    paths:
      - "AppleWatch/**"
      - ".github/workflows/native-quick-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode version
        run: xcodebuild -version
      - name: Validate modern single-target watch app metadata
        run: |
          python3 - <<'PY'
          import plistlib
          with open("AppleWatch/Watch/Info.plist", "rb") as file:
              info = plistlib.load(file)
          assert info.get("WKApplication") is True, "Modern watchOS app must have WKApplication=YES"
          assert info.get("WKWatchKitApp") is not True, "Legacy WatchKit 1 key must be removed"
          assert info.get("WKCompanionAppBundleIdentifier"), "Companion app ID is required"
          print("Modern watchOS single-target Info.plist metadata verified")
          PY
      - name: Test exercise progression
        run: |
          swiftc AppleWatch/Shared/WorkoutModels.swift AppleWatch/Shared/ProgramCatalog.swift AppleWatch/Tests/main.swift -o /tmp/hc-progression
          /tmp/hc-progression
      - name: Build Health Coach iPhone with embedded watch
        run: |
          xcodebuild build \
            -project AppleWatch/HealthCoachNative.xcodeproj \
            -scheme HealthCoach \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Build standalone watch scheme
        run: |
          xcodebuild build \
            -project AppleWatch/HealthCoachNative.xcodeproj \
            -scheme HealthCoachWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
