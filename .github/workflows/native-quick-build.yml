name: Fast Health Coach Native Build
on:
  push:
    paths:
      - "AppleWatch/**"
      - ".github/workflows/native-quick-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode version
        run: xcodebuild -version
      - name: Validate modern single-target watch app metadata
        run: |
          python3 - <<'PY'
          import plistlib
          with open("AppleWatch/Watch/Info.plist", "rb") as file:
              info = plistlib.load(file)
          assert info.get("WKApplication") is True, "Modern watchOS app must have WKApplication=YES"
          assert info.get("WKWatchKitApp") is not True, "Legacy WatchKit 1 key must be removed"
          assert info.get("WKCompanionAppBundleIdentifier"), "Companion app ID is required"
          print("Modern watchOS single-target Info.plist metadata verified")
          PY
      - name: Verify IMUN name and app icon integrity
        run: |
          python3 - <<'PY'
          import json, plistlib, struct, zlib
          from pathlib import Path

          for target in ("iPhone", "Watch"):
              base = Path("AppleWatch") / target
              with (base / "Info.plist").open("rb") as source:
                  assert plistlib.load(source)["CFBundleDisplayName"] == "imun"
              folder = base / "Assets.xcassets" / "AppIcon.appiconset"
              manifest = json.loads((folder / "Contents.json").read_text())
              names = {item.get("filename") for item in manifest["images"]}
              assert "IMUNIcon.png" in names, "Missing IMUN app icon declaration"
              data = (folder / "IMUNIcon.png").read_bytes()
              assert data[:8] == bytes([137, 80, 78, 71, 13, 10, 26, 10])
              position, compressed, chunks = 8, [], []
              while position < len(data):
                  size = struct.unpack(">I", data[position:position+4])[0]
                  kind = data[position+4:position+8]
                  payload = data[position+8:position+8+size]
                  stored = struct.unpack(">I", data[position+8+size:position+12+size])[0]
                  assert stored == zlib.crc32(kind + payload), "Corrupt PNG checksum"
                  chunks.append(kind)
                  if kind == b"IDAT":
                      compressed.append(payload)
                  position += 12 + size
                  if kind == b"IEND":
                      break
              assert b"IHDR" in chunks and b"IEND" in chunks
              width, height = struct.unpack(">II", data[16:24])
              assert (width, height) == (1024, 1024)
              assert zlib.decompress(b"".join(compressed)), "Invalid PNG compression"
              print(target, "IMUN Home Screen icon verified")
          PY
      - name: Test exercise progression
        run: |
          swiftc AppleWatch/Shared/WorkoutModels.swift AppleWatch/Shared/ProgramCatalog.swift AppleWatch/Tests/main.swift -o /tmp/hc-progression
          /tmp/hc-progression
      - name: Build Health Coach iPhone with embedded watch
        run: |
          xcodebuild build \
            -project AppleWatch/HealthCoachNative.xcodeproj \
            -scheme HealthCoach \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Build standalone watch scheme
        run: |
          xcodebuild build \
            -project AppleWatch/HealthCoachNative.xcodeproj \
            -scheme HealthCoachWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
