name: Build Health Coach iPhone and Apple Watch

on:
  push:
    paths:
      - "AppleWatch/**"
      - ".github/workflows/native-health-coach.yml"
  pull_request:
    paths:
      - "AppleWatch/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple-simulator-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Validate Xcode project and schemes
        run: |
          xcodebuild -list -project AppleWatch/HealthCoachNative.xcodeproj
      - name: Build iPhone app with embedded watch app
        run: |
          set -o pipefail
          xcodebuild build \
            -project AppleWatch/HealthCoachNative.xcodeproj \
            -scheme HealthCoach \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/healthcoach-derived \
            CODE_SIGNING_ALLOWED=NO \
            | tee /tmp/healthcoach-build.log
      - name: Verify modern watch embedding in iPhone app
        run: |
          APP=/tmp/healthcoach-derived/Build/Products/Debug-iphonesimulator/HealthCoach.app
          test -d "$APP"
          test -d "$APP/PlugIns/HealthCoachWatch.app"
          if test -d "$APP/Watch/HealthCoachWatch.app"; then
            echo "::error::Legacy Watch/ embed detected; modern watch target needs PlugIns/"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/PlugIns/HealthCoachWatch.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :WKCompanionAppBundleIdentifier" "$APP/PlugIns/HealthCoachWatch.app/Info.plist"
      - name: Test strength progression conversions
        run: |
          swiftc \
            AppleWatch/Shared/WorkoutModels.swift \
            AppleWatch/Shared/ProgramCatalog.swift \
            AppleWatch/Tests/main.swift \
            -o /tmp/health-coach-progression-tests
          /tmp/health-coach-progression-tests
      - name: Build Apple Watch app
        run: |
          set -o pipefail
          xcodebuild build \
            -project AppleWatch/HealthCoachNative.xcodeproj \
            -scheme HealthCoachWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee /tmp/healthcoach-watch-build.log

      - name: Install iPhone app with embedded watch on simulator (manual workflow only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          APP=/tmp/healthcoach-derived/Build/Products/Debug-iphonesimulator/HealthCoach.app
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          devices=json.load(sys.stdin)["devices"]
          options=[d for xs in devices.values() for d in xs
                   if "iPhone" in d.get("name","") and d.get("isAvailable",True)]
          print(options[0]["udid"] if options else "")
          ')
          if [ -z "$SIMULATOR_ID" ]; then
            echo "::error::No available iPhone simulator was found"
            exit 1
          fi
          xcrun simctl boot "$SIMULATOR_ID"
          python3 -c 'import subprocess,sys;subprocess.run(["xcrun","simctl","bootstatus",sys.argv[1],"-b"],check=True,timeout=150)' "$SIMULATOR_ID"
          python3 -c 'import subprocess,sys;subprocess.run(["xcrun","simctl","install",sys.argv[1],sys.argv[2]],check=True,timeout=150)' "$SIMULATOR_ID" "$APP"
          xcrun simctl shutdown "$SIMULATOR_ID"
