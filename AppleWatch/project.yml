name: HealthCoachNative
options:
  # XcodeGen currently defaults a modern single-target watchOS app to the
  # legacy Watch/ folder; Xcode 26/27 requires PlugIns/ for this target type.
  postGenCommand: >-
    sed -i '' -e 's|dstPath = "$(CONTENTS_FOLDER_PATH)/Watch";|dstPath = "";|'
    -e 's|dstSubfolderSpec = 16;|dstSubfolderSpec = 13;|'
    HealthCoachNative.xcodeproj/project.pbxproj
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    HC_IOS_BUNDLE_ID: com.dylaneh7.HealthCoachNative
    MARKETING_VERSION: "2.3"
    CURRENT_PROJECT_VERSION: "59"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  HealthCoach:
    type: application
    platform: iOS
    sources:
      - path: iPhone
        excludes:
          - Info.plist
      - path: Shared
    info:
      path: iPhone/Info.plist
    entitlements:
      path: iPhone/HealthCoachPhone.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(HC_IOS_BUNDLE_ID)"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - target: HealthCoachWatch
        embed: true
      - target: IMUNWidgets
        embed: true
  IMUNWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - Info.plist
          - IMUNWidgets.entitlements
      - path: Shared/IMUNWidgetModels.swift
    info:
      path: Widgets/Info.plist
    entitlements:
      path: Widgets/IMUNWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(HC_IOS_BUNDLE_ID).widgets"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_STRICT_CONCURRENCY: minimal
  HealthCoachWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
        excludes:
          - Info.plist
          - HealthCoachWatch.entitlements
      - path: Shared
    info:
      path: Watch/Info.plist
    entitlements:
      path: Watch/HealthCoachWatch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(HC_IOS_BUNDLE_ID).watchkitapp"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
