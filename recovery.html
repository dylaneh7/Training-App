<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <title>Hybrid Coach Recovery</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0b0d10;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .card{width:min(520px,100%);background:#171b21;border:1px solid #303741;border-radius:18px;padding:20px;box-sizing:border-box}
    h1{margin:0 0 8px;font-size:24px}p{color:#a9b2bf;line-height:1.5;margin:8px 0}.status{margin-top:14px;padding:12px;border-radius:12px;background:#11151a;border:1px solid #303741;color:#f5f7fa}.ok{color:#9ed7b4}.bad{color:#ff9b9b}button{width:100%;margin-top:14px;min-height:46px;border-radius:11px;border:1px solid #4d78b3;background:#1d3352;color:#fff;font:inherit;font-weight:700}
  </style>
</head>
<body>
  <div class="card">
    <h1>Repairing Hybrid Coach</h1>
    <p>This removes only Hybrid Coach's service-worker/cache layer. Your local workout log in browser storage is left alone.</p>
    <div id="status" class="status">Starting recovery…</div>
    <button id="retry" type="button">Run recovery again</button>
  </div>
<script>
(async()=>{
  const status=document.getElementById('status');
  const retry=document.getElementById('retry');
  async function recover(){
    retry.disabled=true;
    try{
      status.textContent='Removing old service worker…';
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>r.unregister()));
      }
      status.textContent='Clearing Hybrid Coach cache…';
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.map(k=>caches.delete(k)));
      }
      status.innerHTML='<span class="ok">Recovery complete.</span> Reloading Hybrid Coach from the network…';
      setTimeout(()=>location.replace('./?recovered='+Date.now()),900);
    }catch(err){
      console.error(err);
      status.innerHTML='<span class="bad">Recovery hit an error.</span> Tap the button below to retry.';
      retry.disabled=false;
    }
  }
  retry.addEventListener('click',recover);
  recover();
})();
</script>
</body>
</html>
